[package]
name = "app"
version = "3.3.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# `features` is not optional here: tauri-plugin-sql defines NO default feature —
# only opt-in `sqlite`/`mysql`/`postgres`. Declared as a bare `"2"`, every
# `Database.load('sqlite:zeneva.db')` returned `InvalidDbUrl("… - No database
# driver enabled!")`, because the whole sqlite arm of its `connect` (including the
# `create_dir_all` that makes the app config dir) is behind `#[cfg(feature =
# "sqlite")]`. It had been declared that way since the plugin was added, so
# `getOfflineDb()` returned null on every call on every native build ever shipped
# and `%APPDATA%\com.zeneva.app\zeneva.db` was never created on any machine.
# Nothing failed loudly — SQLite writes are best-effort — so the only symptom was
# an empty offline catalogue once localStorage stopped being written on desktop.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
notify = "8.2.0"
dirs = "7.0.0"

# UI Automation, for reading a legacy POS grid straight out of its window.
# `windows` 0.61 is already in the tree via tauri, so this adds features rather than
# a new major dependency. Read-only: element discovery and the Name property, nothing
# that can send input. See src/win_grid.rs.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", features = ["ring"] }
