name: Generate Keystore

# DISABLED. This workflow generated a NEW signing key and committed it to the
# repository. Running it again would replace the key Play has registered for
# com.zeneva.app, and every build after that would be rejected on upload.
#
# The signing key now lives in the ANDROID_KEYSTORE_BASE64 repository secret
# and is consumed by release.yml. Nothing here needs to run.
#
# Kept for reference only - manual dispatch, and it no longer writes anything.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This workflow is disabled - it would overwrite the Play upload key."
          echo "The signing key is stored in the ANDROID_KEYSTORE_BASE64 secret."
          exit 1

